<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Khata</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lock-screen" aria-labelledby="lock-title">
    <div class="lock-card">
      <h1 id="lock-title">Auto Khata</h1>

      <form id="lock-form" novalidate>
        <label id="password-label" for="password">Enter password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div id="confirm-group" class="hidden">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password">
        </div>

        <button id="submit-password" type="submit">Continue</button>
        <p id="lock-error" class="error-message" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <section id="app" class="hidden">
    <header>
      <h1>Auto Khata</h1>
      <button id="lock-button" type="button">Lock</button>
    </header>
    <main id="main">
      <p>Unlocked. Features coming in next steps.</p>

      <section id="quick-entry">
        <h2>Quick entry</h2>
        <label for="entry-text">One order line per text line</label>
        <textarea id="entry-text" rows="3" placeholder="Ravi 2kg aata 1 tel oil pending"></textarea>
        <button id="entry-add" type="button">Add to preview</button>
      </section>

      <section id="preview-section" class="hidden">
        <h2>Preview (nothing is saved yet)</h2>
        <div id="unparsed-area"></div>
        <table id="preview-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Item</th>
              <th>Qty</th>
              <th>Unit</th>
              <th>Amount</th>
              <th>Paid</th>
              <th>Status</th>
              <th>Due date</th>
              <th>(remove)</th>
            </tr>
          </thead>
          <tbody id="preview-body"></tbody>
        </table>
        <p id="preview-error" role="alert" aria-live="polite"></p>
        <button id="preview-confirm" type="button">Confirm and save</button>
        <button id="preview-cancel" type="button">Cancel</button>
      </section>

      <section id="orders-section">
        <h2>Orders</h2>
        <p id="orders-count">0 orders</p>
        <table id="orders-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Customer</th>
              <th>Item</th>
              <th>Qty</th>
              <th>Amount</th>
              <th>Paid</th>
              <th>Status</th>
              <th>Due date</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </section>

      <details id="dev-tools">
        <summary>Developer tools</summary>
        <label for="parser-test-file">Parser test file</label>
        <input id="parser-test-file" type="file" accept=".txt">
        <pre id="parser-results"></pre>
      </details>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
